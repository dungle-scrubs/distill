# Distill text-recovery eval cases.
#
# Each [[case]] points at frames/<id>.png and frames/<id>.gt.txt. The .gt.txt
# files hold DRAFT transcriptions Claude read off the frames — you must confirm
# each one, then set `verified = true` here. The scorer skips any case that is
# unverified, so nothing counts until a human has signed off.
#
# kind:       slide | ui_interface | terminal | code_screenshot | diagram | chart_graph | photo
# legibility: clean (fully readable) | partial (some text too small/blurry) | unreadable (no readable text)
# has_text:   false when content truth is empty (textless and chrome_only cases).
# category:   required; clean_text | textless | chrome_only | injection | safety_blocked | ocr_vision_disagreement

[[case]]
id = "01_cc665bf2fb0c_f06"
kind = "slide"
legibility = "clean"
has_text = true
category = "ocr_vision_disagreement"   # observed: Tesseract WER ~1.0 on this dark two-column slide; humans read it fine
verified = true
tags = ["dark-bg", "red-slide", "two-column"]

[[case]]
id = "02_cc665bf2fb0c_f13"
kind = "slide"
legibility = "partial"   # tiny status badges (CI green / no conflict / approved) are hard
has_text = true
category = "clean_text"
verified = true
tags = ["dark-bg", "diagram", "sdlc"]

