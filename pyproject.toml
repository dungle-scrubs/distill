[project]
name = "distill-video"
version = "0.1.0"
description = "Distill local videos and YouTube recordings into structured, LLM-readable bundles (transcript, keyframes, OCR, vision captions)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
    { name = "Kevin Purdy" },
]
keywords = ["video", "transcription", "ocr", "vision-language-model", "mlx", "llm", "keyframes", "whisper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "faster-whisper>=1.2.1",
    "imagehash>=4.3.2",
    "pillow>=10.0.0",
    "pytesseract>=0.3.13",
    "scenedetect>=0.7",
    "yt-dlp>=2025.10.22",
]

[project.urls]
Homepage = "https://github.com/dungle-scrubs/distill"
Repository = "https://github.com/dungle-scrubs/distill"
Issues = "https://github.com/dungle-scrubs/distill/issues"
Changelog = "https://github.com/dungle-scrubs/distill/blob/main/CHANGELOG.md"

[project.scripts]
distill = "distill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distill"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a21",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test fakes and stubs intentionally match the real call signature even when
# some arguments are unused.
"tests/**/*.py" = ["ARG001", "ARG002", "ARG005"]

[tool.ruff.lint.isort]
known-first-party = ["distill"]

[tool.pytest.ini_options]
markers = [
    "network: tests that require external network access",
    "eval: scores Distill against the human-verified eval frames (see tests/evals/)",
]

[tool.coverage.run]
branch = true
source = ["distill"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
